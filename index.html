<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>execu0te Bookmarklet</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            text-align: center;
        }
        h1 { color: #00ff88; margin-bottom: 10px; }
        p { color: #888; max-width: 600px; margin-bottom: 40px; line-height: 1.5; }
        
        .bookmark-btn {
            background-color: #1a1a1a;
            border: 2px solid #00ff88;
            color: #fff;
            padding: 15px 30px;
            font-family: inherit;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.2);
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 10px;
            text-decoration: none; /* For the real bookmarklet link */
        }
        .bookmark-btn:hover {
            background-color: #00ff88;
            color: #000;
            box-shadow: 0 0 25px rgba(0, 255, 136, 0.5);
            transform: scale(1.05);
        }
        
        .arrow { font-size: 20px; }
        
        .note {
            margin-top: 20px;
            font-size: 12px;
            color: #555;
        }
    </style>
</head>
<body>

    <h1>INSTALL EXECU0TE</h1>
    <p>Drag the button below into your bookmarks bar.<br>
    If you can't see the bar, press <strong>Ctrl + B</strong> (Windows) or <strong>Cmd + B</strong> (Mac).</p>

    <!-- This is the actual bookmarklet link -->
    <a id="bookmarklet-link" class="bookmark-btn" href="https://raw.githubusercontent.com/itzzEIias/execu0ter/refs/heads/main/execu0ter.js

    <div class="note">
        execu0ter <br>
    </div>

    <script>
        // This script just loads the bookmarklet logic dynamically if you click the button directly
        document.getElementById('bookmarklet-link').addEventListener('click', function(e) {
            // If the user clicks it, it runs the code directly
            // This is just a fallback if drag-and-drop fails
            const href = this.getAttribute('href');
            // Remove the javascript: prefix for the execution
            const code = href.replace(/^javascript:/, '');
            // Execute it
            eval(code);
            e.preventDefault();
        });
    </script>
</body>
</html>
